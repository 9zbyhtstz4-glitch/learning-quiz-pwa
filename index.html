<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F1EA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>用語から学ぶクイズ</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header><h1>用語から学ぶクイズ <span id="app-version" aria-label="バージョン10">v10</span></h1><p>動作確認用のダミーデータ</p></header>
  <main>
    <p id="cache-status" role="status">オフライン準備を確認しています…</p>
    <p id="error" role="alert" hidden></p>
    <p id="waiting" role="status" hidden>今は次の問題の出題条件を満たしていません。下の用語は引き続き確認できます。</p>
    <section id="question" aria-labelledby="body" hidden>
      <p id="meta"></p><h2 id="body" tabindex="-1"></h2>
      <div id="choices"></div>
      <div id="feedback" aria-live="polite"></div>
      <p id="definition" role="status" hidden></p>
      <div class="actions"><button id="back" hidden>元の問題に戻る</button><button id="next">次の問題</button></div>
      <details><summary>参考資料（外部サイト・オンライン時のみ）</summary><ul id="sources"></ul></details>
    </section>
    <details><summary>用語一覧</summary><p>待機中も用語を調べられます。</p><div id="terms"></div></details>
  </main>
  <noscript>このアプリにはJavaScriptが必要です。</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
