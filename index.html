<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F1EA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>用語から学ぶクイズ</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="study-screen">
  <header><h1>用語から学ぶクイズ <span id="app-version" aria-label="バージョン11">v11</span></h1></header>
  <main>
    <p id="cache-status" role="status" hidden></p>
    <p id="error" role="alert" hidden></p>
    <p id="waiting" role="status" hidden>待機中・用語は確認できます</p>
    <section id="question" aria-labelledby="body" hidden>
      <p id="meta"></p><h2 id="body" tabindex="-1"></h2>
      <div id="choices"></div>
      <div id="feedback" aria-live="polite"></div>
      <p id="definition" role="status" hidden></p>
      <div class="actions"><button id="back" hidden>元の問題に戻る</button><button id="next">次の問題</button></div>
    </section>
  </main>
  </div>
  <aside aria-label="補足情報">
    <details><summary>参考資料（オンライン）</summary><ul id="sources"></ul></details>
    <details><summary>用語一覧</summary><div id="terms"></div></details>
  </aside>
  <noscript>このアプリにはJavaScriptが必要です。</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
